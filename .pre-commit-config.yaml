# Hooks pinned by commit SHA (harness/pinning.md). Install once: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20 # v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
  - repo: https://github.com/bridgecrewio/checkov
    rev: 9504d068f8411b04a0ad67099d0d302242ba7d43 # 3.4.0
    hooks:
      - id: checkov
        args: [--quiet, --compact]
  - repo: local
    hooks:
      - id: claude-lockdown
        name: claude guardrails (R-06)
        entry: scripts/claude-lockdown.sh
        language: system
        files: ^(\.claude/|scripts/claude-lockdown\.sh)
        pass_filenames: false
